map $uri $cache_control {
    default   "no-cache";   # always check for a newer card
    ~^/api/   "no-store";   # guest lists never sit in a cache
    ~^/fonts/ "public, max-age=604800";   # a week; rebuilt only when the card's wording changes
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 2m;   # CSV imports

    gzip on;
    gzip_comp_level 6;   # the default (1) sends the card ~18% bigger: 36.7 KB vs 31.1 KB
    gzip_proxied any;    # still compress when a proxy in front adds a Via header
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Docker's DNS, looked up per request so a restarted api container is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # `make dev` mounts frontend/dev/livereload.conf here; in production this matches nothing
    include /etc/nginx/dev.d/*.conf;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Everything else is the card. A group's link (/<id>) is read by the page itself.
    location / {
        try_files $uri /index.html;
    }
}
