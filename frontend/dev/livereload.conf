# Dev only: mounted into /etc/nginx/dev.d/ by docker-compose.dev.yml. Production has no such files.
set $livereload http://livereload:35729;

location /__livereload/ {
    proxy_pass $livereload;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # Server-Sent Events must stream
    proxy_read_timeout 1h;
}

# Add the reload script to every HTML page
sub_filter '</body>' '<script src="/__livereload/client.js"></script></body>';
sub_filter_once on;
