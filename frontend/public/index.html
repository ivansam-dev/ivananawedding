    n.textContent = note || '';
  }

  function applyLanguage(code) {
    const t = TEXT[code];
    $('coverPrint').querySelector('.cover-art').classList.toggle('is-blank', !GUESTS.length && !LOCKED);   // no guest name: just the 囍
    if (GUESTS.length || LOCKED) {
      fillCover($('coverPrint'), LOCKED ? NO_LINK[code].who : GUESTS, code, LOCKED ? NO_LINK[code].note : '');
    }
    $('cardHint').textContent = t.hint;
    root.lang = code;
    document.title = t.title;
    hint.textContent = t.hint;
    envBtn.setAttribute('aria-label', t.open[OPENS]);
    tray.setAttribute('aria-label', t.more);
    replay.setAttribute('aria-label', t.replay);
    replay.title = t.replay;
    $('duckA').setAttribute('aria-label', DUCK_LABEL[code]);
    $('duckB').setAttribute('aria-label', DUCK_LABEL[code]);
    document.querySelectorAll('#fly [data-i18n]').forEach((el) => { el.innerHTML = t[el.dataset.i18n]; });
    paintLayout(fly, placed, code);                     // the admin's words, where it has changed them
    setWords(fly.querySelector('.inv-names'), namesIn(STD_NAMES, code), true);
    renderEvents(code);
    renderFaq(code);
    renderReply(code);
    showLetter(front);
    /* the letter inside the envelope is a copy of the card's cover */
    letter.textContent = '';
    const print = $('coverPrint').cloneNode(true);
    print.removeAttribute('id');
    letter.appendChild(print);
  }

  const make = (tag, cls, text) => {
    const el = document.createElement(tag);
    el.className = cls;
    el.textContent = text;
    return el;
  };
  /* the invitation's events, one column each, with a gold rule between them */
  function renderEvents(code) {
    const columns = EVENTS.map((e) => {
      const t = e[code] || e.en;
      const addr = make(e.map ? 'a' : 'p', 'inv-sc inv-addr', t.address);
      if (e.map) Object.assign(addr, { href: e.map, target: '_blank', rel: 'noopener' });
      const col = make('div', 'inv-event', '');
      /* the time leads the date ("12pm, Thursday 4 March 2027"); Chinese reads date then time */
      const when = code === 'zh-Hant' ? t.day + t.time : `${t.time}, ${t.day}`;
      col.append(make('p', 'inv-sc inv-day', when), make('h2', 'inv-sc inv-what', t.name),
                 make('p', 'inv-sc inv-venue', t.venue), addr);
      return col;
    });
    $('invEvents').replaceChildren(...columns.flatMap((col, i) => (i ? [make('span', 'inv-rule', ''), col] : [col])));
  }

  /* the details' questions, each with its answer beneath */
  function renderFaq(code) {
    $('faqList').replaceChildren(...FAQS.map((f) => {
      const t = f[code] || f.en, item = make('div', 'faq-item', '');
      item.append(make('dt', 'faq-q', t.q), make('dd', 'faq-a', t.a));
      return item;
    }));
  }

  /* which letter the card shows: one [data-letter] block, and whatever lives on it ([data-on-letter]).
     Each letter has its own shape once open (width / height). The save the date leaves the envelope at
     1.618 and turns over; the others leave it folded in half and unfold into a portrait sheet twice as tall */
  const FOLDED = 1.618;
  const SHAPE = { save_the_date: FOLDED, invitation: 0.74, rsvp: 0.74, details: 0.74 };   // a little longer than two golden halves
  const FOLDS = new Set(['invitation', 'rsvp', 'details']);
  /* the save the date can be made taller in the admin's Card layout view (std_height): its width stays */
  const shapeOf = (key) => (key === 'save_the_date' ? FOLDED / placed.std_height : SHAPE[key] || FOLDED);
  const foldedOf = (key) => (FOLDS.has(key) ? shapeOf(key) * 2 : shapeOf(key));   // a folding letter is half its sheet until it opens
  let cardOpen = false;                                  // false while the card still shows its cover
  let front = OPENS;
  const livesOn = (el, key) => el.dataset.onLetter.split(' ').includes(key);   // data-on-letter: the letters it lives on
  function showLetter(key) {
    const reshape = key !== front;
    front = key;
    if (reshape && L.wf) layout();
    backFace.querySelectorAll('[data-letter]').forEach((el) => { el.hidden = el.dataset.letter !== key; });
    backFace.querySelectorAll('[data-on-letter]').forEach((el) => { el.hidden = !livesOn(el, key); });
    backFace.setAttribute('aria-label', TEXT[root.lang].letters[key]);
  }

  /* ---------- sizing ---------- */
  let L = {}, CARD_W = 122, CARD_H = 75;
  const letterT = (dy = 0) => `translate(${L.lx}px, ${L.ly + dy}px) scale(${L.s})`;
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const we = Math.round(Math.min(500, vw * 0.84, vh * 0.56));
    const he = we / 1.4;
    /* the card is wider than it is tall; type keeps its size, so the extra width is white space.
       k is fixed so the phone renders an exact scaled-down copy of the desktop card */
    const k = CARD_K;
    /* the width is shared by every letter, so type keeps its size when they swap; the tallest
       letter this guest has must still fit the screen with room for the tray */
    const tallest = Math.min(...LETTERS.map(shapeOf));
    const wf = Math.round(Math.min(CARD_FULL * k, vw * 0.92, ((vh * 0.9) / 1.4) * k, vh * 0.74 * tallest));
    const u = wf / k / 100;
    const hh = wf / (cardOpen ? shapeOf(front) : foldedOf(front));
    /* inside the envelope the card sits 92% as wide as it, or smaller if it is too tall to hide */
    const s = Math.min((we * 0.92) / wf, (he - we * 0.058) / hh);
    L = { vw, vh, we, he, wf, hh, s, u, k, lx: (we - wf * s) / 2, ly: he - we * 0.028 - hh * s };
    root.style.setProperty('--we', we + 'px');
    root.style.setProperty('--he', he + 'px');
    root.style.setProperty('--wf', wf + 'px');
    root.style.setProperty('--hh', hh + 'px');
    root.style.setProperty('--u', u + 'px');
    root.style.setProperty('--diet-s', String(Math.min(1, (u * 2.14) / 16)));   // see .reply-diet
    CARD_W = wf / u; CARD_H = hh / u;
    if (state === 'idle' || state === 'ready') letter.style.transform = letterT(0);
    sizeTray();
  }

  /* ---------- states ---------- */
  let state = 'idle', run = 0, pending = false;

  async function land() {
    const my = ++run;
    state = 'idle';
    const a = envLand.animate([
      { transform: `translateY(${L.vh * 0.62 + L.he}px) rotate(-1.4deg)` },
      { transform: 'translateY(0) rotate(0deg)' }
    ], { duration: T(3000), easing: 'cubic-bezier(.06,.8,.14,1)', fill: 'both' });
    setTimeout(() => {
      if (my !== run) return;
      state = 'ready';
      stage.classList.add('is-ready');
      if (pending) { pending = false; open(); }
    }, T(1900));
    try { await a.finished; } catch (e) { return; }
    if (my !== run) return;
    envLand.classList.add('landed');
    a.cancel();
    /* the envelope rests for 3 seconds before the hint fades in */
    setTimeout(() => { if (my === run) stage.classList.add('hint-on'); }, 3000);
  }

  async function open() {
    if (state === 'idle') { pending = true; return; }
    if (state !== 'ready') return;
    state = 'opening';
    const my = run;
    const alive = () => my === run;
    stage.classList.add('is-busy');

    /* 1 — the seal pops off, hops and falls away under gravity */
    SFX.unseal(!reduce);
    if (reduce) {
      try {
        await seal.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }).finished;
      } catch (e) { return; }
    } else {
      await dropSeal();
      await wait(650);                                  // let it fall before the flap opens
    }
    if (!alive()) return;

    /* 2 — the flap opens */
    const fd = T(1100), fEase = 'cubic-bezier(.65,0,.35,1)';
    flap.style.transition = `transform ${fd}ms ${fEase}`;
    stage.classList.add('is-opening');
    flapInner.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(180deg)' }],
      { duration: fd, easing: fEase, fill: 'forwards' });
    setTimeout(() => { if (alive()) flap.style.zIndex = '0'; }, fd * 0.49);
    await wait(fd * 0.84);
    if (!alive()) return;

    /* 3 — the card slides out as the envelope sinks */
    const rise = L.ly + L.hh * L.s + 6;
    const sink = L.he * 0.5;
    const rd = T(1500), rEase = 'cubic-bezier(.5,0,.2,1)';
    const rA = letter.animate([{ transform: letterT(0) }, { transform: letterT(-rise) }],
      { duration: rd, easing: rEase, fill: 'forwards' });
    envMove.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${sink}px)` }],
      { duration: rd, easing: rEase, fill: 'forwards' });
    try { await rA.finished; } catch (e) { return; }
    if (!alive()) return;

    /* 4 — hand the card to the front layer and bring it forward */
    fly.style.transform = 'none';
    const R = letter.getBoundingClientRect();
    const F = fly.getBoundingClientRect();
    const from = `translate(${R.left - F.left}px, ${R.top - F.top}px) scale(${R.width / F.width})`;
    fly.style.transform = from;
    fly.classList.add('is-live');
    letter.style.visibility = 'hidden';

    const flyD = T(1350);
    const flyA = fly.animate([{ transform: from }, { transform: 'translate(0px, 0px) scale(1)' }],
      { duration: flyD, easing: 'cubic-bezier(.3,.1,.15,1)', fill: 'forwards' });
    csFar.animate([{ opacity: 0 }, { opacity: 0.75 }], { duration: flyD, easing: 'ease-out', fill: 'forwards' });
    envMove.animate([
      { transform: `translateY(${sink}px)`, opacity: 1 },
      { transform: `translateY(${sink + L.vh * 0.75}px)`, opacity: 0 }
    ], { duration: T(1250), easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
    await wait(flyD * 0.86);
    if (!alive()) return;

    /* the card rests showing Ivan & Ana (or the guest's name) until it is tapped */
    try { await flyA.finished; } catch (e) { return; }
    if (!alive()) return;
    if (LOCKED) {                                       // no personal link: the card stays on its cover
      fly.getAnimations().forEach((a) => a.cancel());   // a held transform would keep the card a bitmap
      fly.style.transform = '';
      stage.classList.add('is-flat');
      fly.setAttribute('aria-hidden', 'false');
      state = 'locked';
      setTimeout(() => { if (alive()) stage.classList.add('is-done'); }, T(1200));
      return;
    }
    await waitForCardTap();
    if (!alive()) return;

    /* 5 — the card turns over, or the invitation unfolds */
    if (FOLDS.has(front)) {
      if (!(await unfold(alive))) return;
    } else {
      cardOpen = true;
      const ud = T(1500), uEase = 'cubic-bezier(.55,0,.25,1)';
      const opts = { duration: ud, easing: uEase, fill: 'forwards' };
      const uA = card3d.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }], opts);
      /* everything else follows the card's angle on smooth curves, sampled at the same eased progress p */
      const N = 30, FLOOR = 0.2;
      const curve = (fn) => Array.from({ length: N + 1 }, (_, i) => fn(i / N));
      const lift = (p) => Math.sin(Math.PI * p);                                   // 0 → 1 (edge-on) → 0
      const wide = (p) => Math.sqrt(Math.cos(Math.PI * p) ** 2 + FLOOR ** 2) / Math.sqrt(1 + FLOOR ** 2);
      shift.animate(curve((p) => ({ transform: `scale(${(1 + 0.05 * lift(p)).toFixed(4)})` })), opts);
      cardShadow.animate(curve((p) => ({
        transform: `translateY(${(lift(p) * L.u * 2).toFixed(2)}px) scaleX(${wide(p).toFixed(4)})`,
        opacity: (1 - 0.4 * lift(p)).toFixed(4)
      })), opts);
      csFar.animate([{ opacity: 0.75 }, { opacity: 1 }], opts);
      const shading = curve((p) => ({ opacity: lift(p).toFixed(4) }));
      shadeFront.animate(shading, opts);
      shadeBack.animate(shading, opts);
      setTimeout(() => { if (alive()) stage.classList.add('is-revealed'); }, ud * 0.6);
      try { await uA.finished; await flyA.finished; } catch (e) { return; }
      if (!alive()) return;
    }
    if (!alive()) return;

    /* settle into plain CSS so the card follows window resizes */
    stage.classList.remove('is-unfolding');
    stage.classList.add('is-open', 'is-flat');
    [fly, shift, cardShadow, csFar, card3d, shadeFront, shadeBack, faceFront, foldInner, shadeInner]
      .forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    fly.style.transform = '';
    fly.setAttribute('aria-hidden', 'false');
    state = 'open';
    setTimeout(() => { if (alive()) duckEnter(); }, 7000);     // the left duckling arrives a little later
    setTimeout(() => { if (alive()) finish(); }, T(2200));     // then the other letters appear beneath
  }

  /* the invitation opens like a folded card: the cover lifts toward you on its hinge across the middle
     and lies flat above, so the card becomes a portrait sheet twice as tall. The card stays centred */
  async function unfold(alive) {
    const h = L.hh;                                       // the folded card: one half of the sheet
    cardOpen = true;
    layout();                                             // the card is now the whole sheet...
    stage.classList.add('is-unfolding');                  // ...with the cover folded over its lower half
    const ud = T(1700), uEase = 'cubic-bezier(.55,0,.25,1)';
    const opts = { duration: ud, easing: uEase, fill: 'forwards' };
    const N = 30;
    const curve = (fn) => Array.from({ length: N + 1 }, (_, i) => fn(i / N));
    const lift = (p) => Math.sin(Math.PI * p);
    const up = (p) => Math.max(0, -Math.cos(Math.PI * p));               // how much of the flap shows above the fold
    const fA = faceFront.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(180deg)' }], opts);
    foldInner.animate([
      { transform: 'rotateX(0deg) translateY(50%) rotateX(180deg) translateY(-50%)' },
      { transform: 'rotateX(180deg) translateY(50%) rotateX(180deg) translateY(-50%)' }
    ], opts);
    /* what shows runs from the top of the flap to the bottom of the sheet: keep it centred, shadow and all */
    card3d.animate(curve((p) => ({ transform: `translateY(${(-h * (1 - up(p)) / 2).toFixed(2)}px)` })), opts);
    cardShadow.animate(curve((p) => ({
      transform: `translateY(${(lift(p) * L.u * 2).toFixed(2)}px) scaleY(${((1 + up(p)) / 2).toFixed(4)})`,
      opacity: (1 - 0.3 * lift(p)).toFixed(4)
    })), opts);
    shift.animate(curve((p) => ({ transform: `scale(${(1 + 0.03 * lift(p)).toFixed(4)})` })), opts);
    csFar.animate([{ opacity: 0.75 }, { opacity: 1 }], opts);
    const shading = curve((p) => ({ opacity: (lift(p) * 0.8).toFixed(4) }));
    shadeFront.animate(shading, opts);
    shadeInner.animate(shading, opts);
    try { await fA.finished; } catch (e) { return false; }
    if (!alive()) return false;
    stage.classList.add('is-revealed');                   // the flap lies flat: now the words appear
    return true;
  }

  /* the seal leaves the flap as a free body: a small hop, then gravity takes it off the page */
  function dropSeal() {
    const r = seal.getBoundingClientRect();
    const body = seal.cloneNode(true);
    body.removeAttribute('id');
    body.classList.add('is-falling');
    Object.assign(body.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', transform: 'none' });
    document.body.appendChild(body);
    seal.style.visibility = 'hidden';

    const unit = r.width / 110;                         // scale the physics to the seal's size
    const g = 2600 * unit;                              // px / s²
    let x = 0, y = 0, rot = 0;
    const rand = (a, b) => a + Math.random() * (b - a);
    let vx = rand(-280, 280) * unit;                    // anywhere from a hard left to a hard right
    let vy = rand(-620, -480) * unit;                   // the hop
    const vr = (Math.random() < 0.5 ? -1 : 1) * rand(140, 320);   // a gentle spin, either way
    let last = performance.now();
    const t0 = last;
    return new Promise((resolve) => {
      let peaked = false;
      const step = (now) => {
        const dt = Math.min(0.032, (now - last) / 1000);
        last = now;
        vy += g * dt; x += vx * dt; y += vy * dt; rot += vr * dt;
        const lift = Math.max(0, 1 - (now - t0) / 260) * 0.08;   // rises toward you on the hop
        body.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${1 + lift})`;
        if (!peaked && vy >= 0) { peaked = true; resolve(); }
        if (r.top + y < window.innerHeight + 40 && body.isConnected) requestAnimationFrame(step);
        else body.remove();
      };
      requestAnimationFrame(step);
    });
  }

  let cardWait = null;
  function waitForCardTap() {
    stage.classList.add('is-awaiting');
    const hintTimer = setTimeout(() => {
      if (cardWait) stage.classList.add('card-hint-on');
    }, 3000);
    fly.setAttribute('aria-hidden', 'false');
    fly.setAttribute('role', 'button');
    fly.setAttribute('aria-label', TEXT[root.lang].hint);
    fly.tabIndex = 0;
    return new Promise((resolve) => {
      const go = (e) => {
        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        cardWait();
        resolve();
      };
      cardWait = () => {
        fly.removeEventListener('click', go);
        fly.removeEventListener('keydown', go);
        clearTimeout(hintTimer);
        stage.classList.remove('is-awaiting', 'card-hint-on');
        fly.removeAttribute('role');
        fly.removeAttribute('tabindex');
        cardWait = null;
      };
      fly.addEventListener('click', go);
      fly.addEventListener('keydown', go);
    });
  }

  function reset() {
    SFX.cut();
    turnSheen(0);
    if (cardWait) cardWait();
    document.querySelectorAll('.seal.is-falling, .ghost').forEach((el) => el.remove());
    tray.replaceChildren();
    resetDucks();
    seal.style.visibility = '';
    run++;
    [envLand, envMove, letter, seal, flapInner, fly, shift, cardShadow, csFar, card3d, shadeFront, shadeBack, faceFront, foldInner, shadeInner]
      .forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    replyMsg.textContent = '';
    cardOpen = false;
    stage.className = 'stage';
    envLand.classList.remove('landed');
    flap.style.zIndex = '';
    flap.style.transition = '';
    letter.style.visibility = '';
    fly.classList.remove('is-live');
    fly.style.transform = '';
    fly.setAttribute('aria-hidden', 'true');
    state = 'idle';
    pending = false;
    layout();
  }

  /* ---------- replying: the RSVP card, which "Kindly RSVP by …" on the invitation brings forward ---------- */
  const rsvpOpen = $('rsvpOpen'), replyForm = $('replyForm'), replyGuests = $('replyGuests'),
        replyMsg = $('replyMsg'), replySend = $('replySend');
  const canSend = !!(request && request.id);                         // not the admin's preview
  let sending = false;

  /* one row per guest: their name; for each event, its name over attending or not; and their dietary requirements */
  function renderReply(code) {
    const t = TEXT[code].reply;
    rsvpOpen.disabled = !LETTERS.includes('rsvp');
    $('replyTitle').textContent = TEXT[code].invReply;
    replyMsg.textContent = '';
    replyGuests.replaceChildren(...REPLY.map((g) => {
      const pick = CHOSEN.get(g.id);
      const row = document.createElement('div');
      row.className = 'reply-guest';
      row.dataset.guest = g.id;
      row.setAttribute('role', 'group');
      row.setAttribute('aria-label', g.name);
      const name = document.createElement('p');
      name.className = 'reply-name';
      name.textContent = g.name;
      const events = make('div', 'reply-events', '');
      events.append(...EVENTS.filter((e) => e.reply).map((e) => {
        const what = (e[code] || e.en).name;
        const event = make('div', 'reply-event', '');
        event.dataset.answer = e.reply;
        event.setAttribute('role', 'group');
        event.setAttribute('aria-label', what);
        const choices = make('div', 'reply-choices', '');
        choices.append(...ANSWERED.map((value) => {
          const b = make('button', 'reply-choice', t[value]);
          b.type = 'button';
          b.dataset.value = value;
          b.setAttribute('aria-pressed', String(pick.answers[e.reply] === value));
          return b;
        }));
        event.append(make('p', 'reply-event-name', what), choices);
        return event;
      }));
      /* dietary requirements: a line like the events', its name on the left and the box where their choices are.
         The box sits on hidden copies of the choices, so it is exactly as wide as they are */
      const diet = document.createElement('input');
      Object.assign(diet, { type: 'text', className: 'reply-diet', id: `diet${g.id}`, maxLength: 300, placeholder: t.dietaryHint,
                            value: pick.dietary, autocomplete: 'off' });
      diet.setAttribute('aria-label', `${t.dietary}: ${g.name}`);
      const sizer = make('span', 'reply-choices reply-sizer', '');
      sizer.setAttribute('aria-hidden', 'true');
      sizer.append(...ANSWERED.map((value) => make('span', 'reply-choice', t[value])));
      const slot = make('div', 'reply-diet-slot', '');
      slot.append(sizer, diet);
      const dietLine = make('div', 'reply-event', '');
      const label = make('label', 'reply-event-name', t.dietary);
      label.htmlFor = diet.id;
      dietLine.append(label, slot);
      events.append(dietLine);
      row.append(name, events);
      return row;
    }));
    updateSend();
  }
  function updateSend() {
    const t = TEXT[root.lang].reply;
    replySend.textContent = sending ? t.sending : t.send;
    replySend.disabled = sending || !canSend || ![...CHOSEN.values()].some(picked);
  }
  replyGuests.addEventListener('click', (e) => {
    const b = e.target.closest('.reply-choice');
    if (!b || sending) return;
    const row = b.closest('.reply-guest'), event = b.closest('.reply-event'), pick = CHOSEN.get(Number(row.dataset.guest));
    pick.answers[event.dataset.answer] = b.dataset.value;
    event.querySelectorAll('.reply-choice').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    replyMsg.textContent = '';
    updateSend();
  });
  replyGuests.addEventListener('input', (e) => {
    if (!e.target.classList.contains('reply-diet')) return;
    CHOSEN.get(Number(e.target.closest('.reply-guest').dataset.guest)).dietary = e.target.value;
    replyMsg.textContent = '';
  });
  replyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    /* each guest with an answer, for whichever events they've answered; the dietary requirements only for someone coming */
    const replies = REPLY.map((g) => [g, CHOSEN.get(g.id)]).filter(([, c]) => picked(c))
      .map(([g, c]) => ({ guest_id: g.id, ...Object.fromEntries(ANSWERS.filter((k) => c.answers[k]).map((k) => [k, c.answers[k]])),
                          dietary: coming(c) ? c.dietary.trim().slice(0, 300) : '' }));
    if (!replies.length || sending || !canSend) return;
    const t = () => TEXT[root.lang].reply;
    sending = true;
    updateSend();
    let ok = false;
    try {
      const r = await fetch(`/api/invite/${request.id}/rsvp`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ replies })
      });
      const d = r.ok ? await r.json() : null;
      if (d && Array.isArray(d.guests)) {
        const typed = new Map([...CHOSEN].map(([id, c]) => [id, c.dietary]));
        setReply(d.guests);

    if (item) bringForward(item.dataset.letter);
  });

  /* ---------- hidden admin: tap 囍 five times on the language screen ----------
     The password is checked by the backend, and decides the level (root, or links only).
     admin.js is fetched only now, so guests never download it. */
  const maker = $('maker'), passEl = $('makerPass'), makerGo = $('makerGo'), makerMsg = $('makerMsg');
  let xiTaps = 0, xiTimer = 0, adminMod = null;
  const loadAdmin = () => (adminMod ||= import('/admin.js').catch((e) => { adminMod = null; throw e; }));
  const adminOptions = { onExpired: () => toggleMaker(true) };
  $('langXi').addEventListener('click', () => {
    clearTimeout(xiTimer);
    xiTimer = setTimeout(() => { xiTaps = 0; }, 1600);
    if (++xiTaps >= 5) { xiTaps = 0; summonAdmin(); }
  });
  async function summonAdmin() {
    if (!maker.hidden) { toggleMaker(false); return; }
    try {
      const admin = await loadAdmin();
      const me = await admin.session();                    // still signed in on this device: straight in
      if (me) { admin.openAdmin(me, adminOptions); return; }
    } catch (e) { /* no backend reachable: the password field will say so */ }
    toggleMaker(true);
  }
  function toggleMaker(show) {
    if (show) {
      maker.hidden = false;
      picker.classList.add('making');
      makerMsg.textContent = '';
      requestAnimationFrame(() => maker.classList.add('is-open'));
      setTimeout(() => passEl.focus({ preventScroll: true }), 300);
    } else {
      maker.classList.remove('is-open');
      passEl.value = '';
      passEl.blur();
      setTimeout(() => { maker.hidden = true; picker.classList.remove('making'); }, 450);
    }
  }
  maker.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!passEl.value || makerGo.disabled) return;
    makerGo.disabled = true;
    makerMsg.textContent = '';
    try {
      const admin = await loadAdmin();
      const me = await admin.login(passEl.value);
      toggleMaker(false);
      admin.openAdmin(me, adminOptions);
    } catch (err) {
      makerMsg.textContent = err.status === 401 ? 'Incorrect password'
        : err.status === 429 ? 'Too many tries. Please wait a while.'
        : 'Could not sign in. Please try again.';
      maker.classList.remove('is-wrong');
      void maker.offsetWidth;                                // restart the shake
      maker.classList.add('is-wrong');
      passEl.select();
    } finally {
      makerGo.disabled = false;
    }
  });

  /* ---------- events ---------- */
  envBtn.addEventListener('click', open);
  envBtn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  /* hovering turns the medallion's sheen a little, as if it caught the light */
  const sheenGrads = ['gMedal', 'gMedalIn', 'gMedalXi'].map($);
  let sheen = 0, sheenTo = 0, sheenRaf = 0;
  const stepSheen = () => {
    sheen += (sheenTo - sheen) * 0.07;
    if (Math.abs(sheenTo - sheen) < 0.05) sheen = sheenTo;
    sheenGrads.forEach((g) => g.setAttribute('gradientTransform', `rotate(${sheen.toFixed(2)} .5 .5)`));
    sheenRaf = sheen !== sheenTo ? requestAnimationFrame(stepSheen) : 0;
  };
  const turnSheen = (deg) => { sheenTo = deg; if (!sheenRaf) sheenRaf = requestAnimationFrame(stepSheen); };
  envBtn.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && state === 'ready') turnSheen(28); });
  envBtn.addEventListener('pointerleave', () => turnSheen(0));
  envBtn.addEventListener('focus', () => { if (state === 'ready') turnSheen(28); });
  envBtn.addEventListener('blur', () => turnSheen(0));
  const picker = $('lang');
  function showPicker() {
    picker.classList.add('is-shown');
  }
  /* 17 hearts pop up at the bottom right, float to the top right and burst;
     resolves as the last few are bursting, which is the cue for the envelope */
  /* flat red, with a fine engraved inner line like the medallion */
  const HEART_D = 'M16 29C16 29 1 19.5 1 9.5C1 4.5 5 1 9.5 1C12.5 1 15 2.8 16 5.2C17 2.8 19.5 1 22.5 1C27 1 31 4.5 31 9.5C31 19.5 16 29 16 29Z';
  const HEART = `<svg viewBox="0 0 32 30"><path d="${HEART_D}" fill="G"/><path d="${HEART_D}" fill="none" stroke="#7d1218" stroke-opacity=".7" stroke-width="1.6" transform="translate(16 15) scale(.74) translate(-16 -15)"/></svg>`;
  const rand = (a, b) => a + Math.random() * (b - a);
  function sparks(x, y, size) {
    const layer = $('hearts'), n = 7, colours = ['#c4313a', '#a8222a', '#d4505a'];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), d = size * rand(0.6, 1.05), r = Math.max(2.5, size * rand(0.09, 0.15));
      const el = document.createElement('i');
      el.className = 'spark';
      Object.assign(el.style, { width: r + 'px', height: r + 'px', background: colours[i % colours.length] });
      layer.appendChild(el);
      el.animate([
        { transform: `translate(${x - r / 2}px, ${y - r / 2}px) scale(1)`, opacity: 1 },
        { transform: `translate(${x - r / 2 + Math.cos(a) * d}px, ${y - r / 2 + Math.sin(a) * d}px) scale(.3)`, opacity: 0 }
      ], { duration: 420, easing: 'cubic-bezier(.2,.7,.3,1)' }).finished.then(() => el.remove(), () => el.remove());
    }
  }
  function heartsBurst() {
    return new Promise((resolve) => {
      const layer = $('hearts'), vw = innerWidth, vh = innerHeight;
      const k = Math.min(1.25, Math.max(0.7, Math.min(vw, vh) / 760));
      const N = 17, cue = N - 3;
      const sizes = Array.from({ length: N }, (_, i) => 6 + i * (12 / (N - 1)));
      for (let i = sizes.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [sizes[i], sizes[j]] = [sizes[j], sizes[i]]; }
      let popped = 0;
      const pop = () => { if (++popped === cue) resolve(); };
      sizes.forEach((sz, i) => {
        setTimeout(() => {
          const w = sz * k, h = w * 0.94;
          const sx = vw * rand(0.7, 0.95) - w / 2, sy = vh * rand(0.8, 0.95) - h / 2;
          const ex = vw * rand(0.68, 0.96) - w / 2, ey = vh * rand(0.05, 0.22) - h / 2;
          const sway = rand(16, 42) * k * (Math.random() < 0.5 ? -1 : 1);
          const r0 = rand(-18, 18), r1 = rand(-14, 14);
          const dur = rand(1000, 1400);
          const el = document.createElement('div');
          el.className = 'heart';
          el.style.width = w + 'px'; el.style.height = h + 'px';
          el.innerHTML = HEART.replace('fill="G"', `fill="${i % 3 ? '#c4313a' : '#a8222a'}"`);
          layer.appendChild(el);
          const at = (t) => {
            const p = t * t * (3 - 2 * t);                       // ease in and out of the rise
            const x = sx + (ex - sx) * p + sway * Math.sin(p * Math.PI * 1.5);
            const y = sy + (ey - sy) * p;
            return `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(r0 + (r1 - r0) * p).toFixed(1)}deg)`;
          };
          const frames = [{ transform: `${at(0)} scale(0)`, offset: 0, easing: 'cubic-bezier(.2,1.7,.4,1)' },
                          { transform: `${at(0.03)} scale(1)`, offset: 0.13 }];
          for (let f = 1; f <= 8; f++) frames.push({ transform: `${at(0.03 + 0.97 * f / 8)} scale(1)`, offset: 0.13 + 0.77 * f / 8 });
          frames.push({ transform: `${at(1)} scale(1.6)`, opacity: 0, offset: 1 });
          frames[frames.length - 2].opacity = 1;
          el.animate(frames, { duration: dur, fill: 'forwards' });
          setTimeout(() => { sparks(ex + w / 2, ey + h / 2, w); SFX.burst((sz - 6) / 12); pop(); }, dur * 0.92);
          setTimeout(() => el.remove(), dur + 60);
        }, i * 55 + rand(0, 40));
      });
    });
  }

  async function choose(code, celebrate) {
    picker.classList.remove('is-shown');
    front = OPENS;                                       // every play opens on the admin's pick
    applyLanguage(code);
    layout();                                            // that letter's shape, now the guest's letters are known
    const cue = celebrate && !reduce ? wait(180).then(heartsBurst) : wait(T(700));
    await Promise.all([fontsReady, cue]);
    requestAnimationFrame(() => requestAnimationFrame(land));
  }
  picker.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]');
    if (b && picker.classList.contains('is-shown')) choose(b.dataset.lang, true);
  });
  replay.addEventListener('click', () => { reset(); showPicker(); });
  window.addEventListener('resize', layout);

  /* ---------- begin once the type has arrived ---------- */
  /* a link ending in ?lang=zh, ?lang=vi or ?lang=en skips the choice */
  layout();
  applyLanguage('en');
  const asked = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
  const direct = { zh: 'zh-Hant', 'zh-hant': 'zh-Hant', vi: 'vi', en: 'en' }[asked];
  const ready = Promise.all([fontsReady, texturesReady, guestsReady]);
  if (direct) ready.then(() => choose(direct));
  else ready.then(showPicker);
})();
</script>
</body>
</html>
